<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object fit and position</title>
    <style>
        .container {
            height: 488px;
            width: 466px;
            border: 2px solid black;
            /* background-color: azure; */
        }

        img{
            width: 466px;
            height: 488px;
            object-fit: cover ;
            /* object-fit: fill; */
            object-position: top right;
            /* object-fit: contain; */
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSwSON-AtZ0lSUNKvL9qum8REp9Fd-eumJ-NXbmHl8oA&s=10"
            alt="Image">
    </div>
</body>

</html>
