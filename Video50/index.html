<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        /* img{
            filter: blur(5px);
        } */
            .img1{
                filter: brightness(122%) contrast(150%);
            }
            .img2{
                filter: sepia(10%);
            }
            /* opacity
             */
            .img3{
                filter: grayscale(20%);
            }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8C191JdCh-vLaAF570ZX04NesIpQl7WQUtRcl0pkDuw&s=10" alt="">
        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsxdv4dRKCeyhUprhj3mxn8P0SpIoVZ6QH7dA__6PNOA&s=10" alt="">
        <img class="img3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIdtLgUtoo6tgPtN8h6T-e47a6Hqo1-8c5Lou8Hc0leQ&s=10" alt="">
    </div>
</body>
</html>
